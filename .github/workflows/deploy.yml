name: Deploy AWS
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [stg, prd]
        default: stg
        required: true
      operation:
        description: Review a plan or apply it
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      deploy_services:
        description: Deploy current containers (requires initial foundation apply and account authentication secret)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-aws-${{ inputs.environment || 'stg' }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  environment-config:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'stg' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate actual environment configuration
        env:
          TARGET_ENV: ${{ inputs.environment || 'stg' }}
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          environment_file="$RUNNER_TEMP/.env.$TARGET_ENV"
          trap 'rm -f "$environment_file"' EXIT
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          target = os.environ['TARGET_ENV']
          secret_name = 'PRODUCTION_ENV_FILE' if target == 'prd' else 'STAGING_ENV_FILE'
          contents = os.environ.get(secret_name, '')
          if not contents.strip():
              raise SystemExit(f'{secret_name} is unavailable in GitHub environment {target}. Save the secret in that environment in this repository.')
          path = Path(os.environ['RUNNER_TEMP']) / f'.env.{target}'
          path.touch(mode=0o600)
          path.chmod(0o600)
          path.write_text(contents)
          PYTHON
          docker compose --env-file "$environment_file" config --quiet

  deploy:
    needs: [validate, environment-config]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'stg' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      ACCOUNT_SECRET_ARN: ${{ vars.ACCOUNT_SECRET_ARN }}
      ACCOUNT_SECRET_KMS_KEY_ARN: ${{ vars.ACCOUNT_SECRET_KMS_KEY_ARN }}
      TARGET_ENV: ${{ inputs.environment || 'stg' }}
      OPERATION: ${{ github.event_name == 'push' && 'apply' || inputs.operation }}
      REQUESTED_DEPLOY_SERVICES: ${{ inputs.deploy_services && 'true' || 'false' }}
      TF_IN_AUTOMATION: 'true'
    defaults:
      run:
        working-directory: infra/aws
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Validate deployment inputs
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set GitHub environment variable AWS_REGION}"
          : "${STATE_BUCKET:?Set GitHub environment variable TF_STATE_BUCKET}"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Initialize remote state
        run: |
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=$TARGET_ENV/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform validate
          terraform output -json > "$RUNNER_TEMP/terraform-outputs.json"
      - name: Resolve deployment configuration
        run: python3 ../../scripts/prepare-aws-deployment.py "$RUNNER_TEMP/terraform-outputs.json"
      - name: Build and push service images
        if: env.OPERATION == 'apply' && env.DEPLOY_SERVICES == 'true'
        run: |
          set -euo pipefail
          terraform output -json ecr_repositories > "$RUNNER_TEMP/ecr.json"
          registry=$(jq -r '.api | split("/")[0]' "$RUNNER_TEMP/ecr.json")
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          while IFS=$'\t' read -r name project; do
            repository_url=$(jq -er --arg name "$name" '.[$name]' "$RUNNER_TEMP/ecr.json")
            repository_name=${repository_url#*/}
            if aws ecr describe-images --repository-name "$repository_name" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
              continue
            fi
            docker build --platform linux/amd64 --build-arg SERVICE_PROJECT="$project" -t "$repository_url:$GITHUB_SHA" ../..
            docker push "$repository_url:$GITHUB_SHA"
          done < <(jq -r '.[] | [.name, .project] | @tsv' ../../services.json)
      - name: Plan
        run: terraform plan -input=false -var-file="environments/$TARGET_ENV.tfvars" -var="aws_region=$AWS_REGION" -var="enable_services=$DEPLOY_SERVICES" -out=deployment.tfplan
      - name: Apply Terraform plan
        if: env.OPERATION == 'apply'
        run: terraform apply -input=false deployment.tfplan
      - name: Check deployed API
        if: env.OPERATION == 'apply' && env.DEPLOY_SERVICES == 'true'
        run: |
          base_url=$(terraform output -raw api_base_url)
          curl --fail --retry 15 --retry-all-errors --retry-delay 5 "${base_url%/api/v1}/health/ready"
          echo "API: $base_url" >> "$GITHUB_STEP_SUMMARY"
