name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Cyllio.sln
      - run: dotnet build Cyllio.sln -c Release --no-restore
      - name: Verify OTP delivery without sending SMS
        run: dotnet run --project tests/Cyllio.Otp.Tests -c Release
      - run: dotnet format Cyllio.sln --verify-no-changes --no-restore
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Validate AWS Terraform
        run: |
          terraform fmt -check -recursive infra/aws infra/bootstrap
          terraform -chdir=infra/aws init -backend=false -input=false
          terraform -chdir=infra/aws validate
          terraform -chdir=infra/aws test
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/bootstrap test
      - name: Verify deployment selection
        run: python3 -m unittest discover -s tests/pipeline -v
      - name: Build and smoke test every service
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs service-smoke 2>/dev/null || true; docker rm -f service-smoke 2>/dev/null || true' EXIT
          while IFS=$'\t' read -r project image; do
            docker build --build-arg SERVICE_PROJECT="$project" -t "$image:ci" .
            # Account hosts are tested with their database in the integration job below.
            if [[ "$project" == "Cyllio.Identity" || "$project" == "Cyllio.Device" ]]; then continue; fi
            docker run -d --name service-smoke -p 127.0.0.1:8080:8080 "$image:ci"
            curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://localhost:8080/health/live
            docker rm -f service-smoke
          done < <(jq -r '.[] | [.project, .image] | @tsv' services.json)

  accounts-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure local account secrets
        shell: bash
        run: |
          printf 'ACCEPT_EULA=N\nMSSQL_SA_PASSWORD=%s\nAUTH_SIGNING_KEY=%s\nAUTH_PHONE_HASH_KEY=%s\n' "$(openssl rand -hex 24)Aa1!" "$(openssl rand -hex 48)" "$(openssl rand -hex 48)" > .env
      - name: Start account APIs and MongoDB
        run: docker compose up --build -d api identity device
      - name: Verify authorization and concurrency
        run: python3 scripts/test-accounts.py
      - name: Show service logs and clean up
        if: always()
        run: |
          docker compose logs --tail 30 api identity device
          docker compose down

  staging-config:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: stg
    steps:
      - uses: actions/checkout@v4
      - name: Validate actual staging configuration
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          staging_file="$RUNNER_TEMP/.env.stg"
          trap 'rm -f "$staging_file"' EXIT
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          contents = os.environ.get('STAGING_ENV_FILE', '')
          if not contents.strip():
              raise SystemExit('Set the stg GitHub environment secret STAGING_ENV_FILE to the contents of your private .env.stg')
          path = Path(os.environ['RUNNER_TEMP']) / '.env.stg'
          path.touch(mode=0o600)
          path.chmod(0o600)
          path.write_text(contents)
          PYTHON
          docker compose --env-file "$staging_file" config --quiet
